name: Android release

# Signed APK on GitHub Releases. Push a tag v<versionName>, e.g. v0.1.0-beta.1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, v<versionName> (created on this commit if missing)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag must match versionName
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ] || [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match versionName '$VERSION' in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Core unit tests
        run: ./gradlew :core:test
      - name: App unit tests (Robolectric, simulated strap)
        run: ./gradlew :app:testDebugUnitTest
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HRVBRIDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret HRVBRIDGE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signon.jks"
      - name: Assemble signed release APK
        env:
          HRVBRIDGE_KEYSTORE_PATH: ${{ runner.temp }}/signon.jks
          HRVBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.HRVBRIDGE_KEYSTORE_PASSWORD }}
          HRVBRIDGE_KEY_ALIAS: ${{ secrets.HRVBRIDGE_KEY_ALIAS }}
          HRVBRIDGE_KEY_PASSWORD: ${{ secrets.HRVBRIDGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Verify signature, checksum, release notes
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # Without all four signing values Gradle writes app-release-unsigned.apk instead.
          if [ ! -f "$APK" ]; then
            echo "::error::No signed release APK; check the four signing secrets"
            ls app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          CERT_SHA256=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::apksigner found no signing certificate"
            exit 1
          fi
          NAME="SignON-$VERSION.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          APK_SHA256=$(cut -d ' ' -f 1 "dist/$NAME.sha256")
          {
            echo "SignON $VERSION for Android 8.0 and newer."
            echo
            echo "Install steps: see the README (Install on Android)."
            echo
            echo "- APK SHA-256: \`$APK_SHA256\`"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\`"
            echo
            echo "Every SignON release is signed with the same certificate. If the fingerprint differs, do not install the APK."
          } > dist/notes.md
          cat dist/notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-beta*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "SignON $VERSION" \
            --notes-file dist/notes.md $PRERELEASE \
            "dist/SignON-$VERSION.apk" "dist/SignON-$VERSION.apk.sha256"
      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signon.jks"
