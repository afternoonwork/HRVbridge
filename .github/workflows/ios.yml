name: iOS

# Runs only for iOS changes (and the shared vectors), once per PR push plus
# pushes to main; superseded runs are cancelled.
on:
  pull_request:
    # labeled: adding the "screenshots" label starts a run with screenshots.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "ios/**"
      - "scripts/ios-snapshots.sh"
      - "core/src/test/resources/test-vectors.json"
      - "core/src/test/resources/recordings/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/ios-snapshots.sh"
      - "core/src/test/resources/test-vectors.json"
      - "core/src/test/resources/recordings/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      states:
        description: 'Screenshot states, space-separated (see scripts/ios-snapshots.sh), or "all"'
        type: string
        default: all
      appearances:
        type: choice
        options: [both, light, dark]
        default: both
      device:
        description: "Simulator device type, e.g. iPhone-SE, iPhone-17, iPhone-17-Pro"
        type: string
        default: iPhone-SE

jobs:
  build:
    # Other labels do not rebuild.
    if: github.event.action != 'labeled' || github.event.label.name == 'screenshots'
    # On the job, so a skipped run for another label cancels nothing.
    concurrency:
      group: ios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Paul builds locally with Xcode 26.3 (Intel Mac maximum). Use the same
      # version when the runner image has it, otherwise the newest 26.x.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          # Image folders are named like Xcode_26.3.0.app.
          XCODE=$(ls -d /Applications/Xcode_26.3*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -n "$XCODE" ] && [ -d "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: HRVCore tests
        run: swift test --package-path ios/HRVCore

      - name: Build app for the iOS simulator (no signing)
        run: |
          xcodebuild build \
            -project ios/HRVBridge/HRVBridge.xcodeproj \
            -scheme HRVBridge \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild-simulator.log 2>&1 || status=$?
          tail -n 40 xcodebuild-simulator.log
          echo "Swift warnings and errors:"
          grep -E "\.swift:[0-9]+:[0-9]+: (warning|error):" xcodebuild-simulator.log | sort -u || echo "none"
          exit "${status:-0}"

      # Nobody can look at the UI from the cloud: screenshot states on an iPhone
      # SE simulator (375 x 667; manual runs can pick another device), as an artifact. Slow (about 15 min for all), so
      # opt-in: manual runs, or PRs labelled "screenshots". A PR body line
      # "snapshots: dial settling" limits the states; otherwise all are taken.
      - name: Screenshots (simulator)
        id: screenshots
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'screenshots')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_STATES: ${{ inputs.states }}
          INPUT_APPEARANCES: ${{ inputs.appearances }}
          SNAPSHOT_DEVICE: ${{ inputs.device || 'iPhone-SE' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            states="$INPUT_STATES"
            case "$INPUT_APPEARANCES" in light|dark) appearances="$INPUT_APPEARANCES" ;; *) appearances="light dark" ;; esac
          else
            states=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -i -m 1 '^[[:space:]]*snapshots:' | sed 's/^[^:]*:[[:space:]]*//' || true)
            appearances="light dark"
          fi
          echo "States: ${states:-all}; appearances: $appearances"
          SNAPSHOT_STATES="$states" SNAPSHOT_APPEARANCES="$appearances" \
            scripts/ios-snapshots.sh build/DerivedData/Build/Products/Debug-iphonesimulator/HRVBridge.app build/screenshots

      - name: Upload screenshots
        if: always() && steps.screenshots.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: build/screenshots
          if-no-files-found: ignore

      # Paul installs on a real iPhone: also compile against the device SDK.
      - name: Build app for iOS devices (no signing)
        run: |
          xcodebuild build \
            -project ios/HRVBridge/HRVBridge.xcodeproj \
            -scheme HRVBridge \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild-device.log 2>&1 || status=$?
          tail -n 40 xcodebuild-device.log
          echo "Swift warnings and errors:"
          grep -E "\.swift:[0-9]+:[0-9]+: (warning|error):" xcodebuild-device.log | sort -u || echo "none"
          exit "${status:-0}"
